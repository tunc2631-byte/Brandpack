name: SEO checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/seo-system-2026-09-19']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/seo/requirements.txt
      - run: python -m unittest discover -s tools/seo -p 'test_*.py'
      - run: python tools/seo/seo.py check --out "$RUNNER_TEMP/seo-check"
      - name: Summarize
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/seo-check/report.md" ]; then
            cat "$RUNNER_TEMP/seo-check/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
  preise-und-bilder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preise aus data/products.json gegen den Schnappschuss der Seiten
        run: node --test tools/qa/*.test.js
      - name: Produktseiten passen zu data/products.json und content/produkte
        run: node tools/build_site.js --check
      - name: Alle verwendeten Web-Bilder vorhanden
        run: python3 tools/build_images.py --check
